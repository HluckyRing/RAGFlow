[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragflow"
version = "1.1.0"
description = "RAGFlow — 多格式知识库问答系统"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.0",
    "sentence-transformers>=5.6.0",
    "pypdf>=6.14.0",
    "python-dotenv>=1.2.0",
    "openai>=2.44.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
# templates/* 覆盖 index.html；vendor 下的渲染库（含嵌套许可证目录）必须一起进 wheel，
# 否则从 release 附件安装后，「原文件预览」会缺 JSZip/docx-preview/SheetJS/PPTX bundle。
src = ["templates/*", "templates/vendor/*", "templates/vendor/aiden0z-pptx-renderer-licenses/*"]
