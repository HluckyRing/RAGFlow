[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragflow"
version = "1.0.0"
description = "RAGFlow — 多格式知识库问答系统。上传 PDF/Word/Excel/TXT，基于 HyDE 检索和 DeepSeek 大模型进行智能问答。"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HluckyRing" }]
keywords = ["rag", "qa", "knowledge-base", "deepseek", "chromadb", "hyde"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chromadb>=1.5.0",
    "sentence-transformers>=5.6.0",
    "pypdf>=6.14.0",
    "python-dotenv>=1.2.0",
    "openai>=2.44.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ragflow = "src.cli:main"

[project.urls]
Homepage = "https://github.com/HluckyRing/RAGFlow"
Repository = "https://github.com/HluckyRing/RAGFlow"
Issues = "https://github.com/HluckyRing/RAGFlow/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["templates/*"]
